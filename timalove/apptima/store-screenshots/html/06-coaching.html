<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, height=844">
  <title>TimaLove — Profil</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 390px; height: 844px; background: rgba(45,31,34,.45); font-family: 'DM Sans', sans-serif; color: #2D1F22; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
    .modal { background: #FDF5F0; border-radius: 20px 20px 0 0; max-height: 92%; display: flex; flex-direction: column; overflow: hidden; }
    .nav { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 14px 16px 8px; background: #fff; border-bottom: 1px solid #F5E6E8; }
    .brand { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; color: #E8637A; }
    .close { width: 36px; height: 36px; border-radius: 50%; border: 0; background: #FFF0F3; color: #E8637A; font-size: 18px; }
    .identity { display: flex; gap: 12px; align-items: center; padding: 14px 16px; background: #fff; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; background: #E8637A; color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 600; flex-shrink: 0; }
    .identity h1 { font-family: 'Playfair Display', serif; font-size: 20px; }
    .identity p { font-size: 12px; color: #6B5A5E; margin-top: 2px; }
    .msg-btn { margin-left: auto; background: #E8637A; color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 600; }
    .thumbs { display: flex; gap: 8px; padding: 0 16px 12px; background: #fff; overflow-x: auto; }
    .thumb { width: 64px; height: 64px; border-radius: 12px; background: #F5E6E8; flex-shrink: 0; display: grid; place-items: center; color: #C4858B; font-weight: 600; }
    .thumb.on { outline: 2px solid #E8637A; }
    .tabs { display: flex; gap: 6px; padding: 0 12px 10px; background: #fff; overflow-x: auto; }
    .tab-btn { border: 0; background: #fff; color: #6B5A5E; font-size: 11px; font-weight: 600; padding: 8px 10px; border-radius: 999px; white-space: nowrap; }
    .tab-btn.on { background: #E8637A; color: #fff; }
    .content { padding: 16px; flex: 1; overflow: hidden; }
    .section-k { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #C4858B; margin-bottom: 8px; }
    .content p { font-size: 14px; line-height: 1.5; color: #2D1F22; }
    .dock { border-top: 1px solid #F5E6E8; background: #fff; display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 0 24px; }
    .tab { text-align: center; font-size: 10px; color: #9B8A8E; }
    .tab.on { color: #E8637A; font-weight: 600; }
    .tab-ico { font-size: 18px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="modal">
    <div class="nav"><span class="brand">TimaLove</span><button class="close" type="button">✕</button></div>
    <div class="identity">
      <div class="avatar">A</div>
      <div><h1>Awa, 28</h1><p>Dakar · Mariage</p></div>
      <button class="msg-btn" type="button">Message</button>
    </div>
    <div class="thumbs">
      <div class="thumb on">A</div><div class="thumb">2</div><div class="thumb">3</div><div class="thumb">4</div>
    </div>
    <div class="tabs">
      <button class="tab-btn on" type="button">À propos</button>
      <button class="tab-btn" type="button">Ce qui l'anime</button>
      <button class="tab-btn" type="button">Ce qui compte</button>
      <button class="tab-btn" type="button">Vers l'autre</button>
    </div>
    <div class="content">
      <p class="section-k">Projet de vie</p>
      <p>Union stable orientée mariage, valeurs familiales fortes et dialogue respectueux avant toute rencontre.</p>
    </div>
    <nav class="dock">
      <span class="tab"><span class="tab-ico">♥</span>Intérêts</span>
      <span class="tab on"><span class="tab-ico">◎</span>Parcours</span>
      <span class="tab"><span class="tab-ico">✉</span>Messages</span>
      <span class="tab"><span class="tab-ico">☺</span>Moi 🙂</span>
    </nav>
  </div>
</body>
</html>
