<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, height=844">
  <title>TimaLove — Parcours</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 390px; height: 844px; background: #FDF5F0; font-family: 'DM Sans', sans-serif; color: #2D1F22; overflow: hidden; display: flex; flex-direction: column; }
    .top { padding: 48px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; color: #E8637A; }
    .filters { font-size: 12px; font-weight: 600; color: #E8637A; background: #fff; border: 1px solid #F5E6E8; border-radius: 999px; padding: 8px 12px; }
    .banner { margin: 8px 16px 0; background: #3D2024; color: #F5E6E8; border-radius: 14px; padding: 12px 14px; }
    .banner-k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #C4858B; margin-bottom: 4px; }
    .banner-v { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; color: #fff; }
    .intro { padding: 14px 16px 6px; }
    .kicker { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #C4858B; }
    h1 { font-family: 'Playfair Display', serif; font-size: 22px; margin: 4px 0; }
    .grid { padding: 6px 16px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; overflow: hidden; }
    .card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(45,31,34,.06); position: relative; }
    .photo { height: 108px; background: #F5E6E8; display: grid; place-items: center; font-size: 26px; color: #C4858B; font-weight: 600; position: relative; }
    .online { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; background: #4CAF50; border: 2px solid #fff; }
    .body { padding: 10px; }
    .name { font-weight: 600; font-size: 13px; }
    .place { font-size: 11px; color: #9B8A8E; margin: 2px 0 6px; }
    .compat { display: inline-block; background: #FFF0F3; color: #E8637A; font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 999px; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .act { width: 32px; height: 32px; border-radius: 50%; border: 0; background: #FFF0F3; color: #E8637A; font-size: 14px; }
    .more { margin: 0 16px 8px; text-align: center; font-size: 12px; font-weight: 600; color: #E8637A; background: #fff; border: 1px solid #F5E6E8; border-radius: 999px; padding: 10px; }
    .dock { border-top: 1px solid #F5E6E8; background: #fff; display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 0 24px; }
    .tab { text-align: center; font-size: 10px; color: #9B8A8E; }
    .tab.on { color: #E8637A; font-weight: 600; }
    .tab-ico { font-size: 18px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="top"><span class="logo">TimaLove</span><span class="filters">Filtres</span></div>
  <div class="banner">
    <p class="banner-k">Objectif recherché</p>
    <p class="banner-v">Mariage</p>
  </div>
  <div class="intro">
    <p class="kicker">Sélection du jour</p>
    <h1>Profils compatibles</h1>
  </div>
  <div class="grid">
    <article class="card"><div class="photo">A<span class="online"></span></div><div class="body"><p class="name">Awa, 28</p><p class="place">Dakar</p><span class="compat">87% Compatible</span><div class="actions"><button class="act">♥</button><button class="act">★</button></div></div></article>
    <article class="card"><div class="photo">F</div><div class="body"><p class="name">Fatou, 26</p><p class="place">Thiès</p><span class="compat">82% Compatible</span><div class="actions"><button class="act">♥</button><button class="act">★</button></div></div></article>
    <article class="card"><div class="photo">M<span class="online"></span></div><div class="body"><p class="name">Mariama, 30</p><p class="place">Saint-Louis</p><span class="compat">79% Compatible</span><div class="actions"><button class="act">♥</button><button class="act">★</button></div></div></article>
    <article class="card"><div class="photo">K</div><div class="body"><p class="name">Khady, 27</p><p class="place">Rufisque</p><span class="compat">76% Compatible</span><div class="actions"><button class="act">♥</button><button class="act">★</button></div></div></article>
  </div>
  <p class="more">Voir plus (+10)</p>
  <nav class="dock">
    <span class="tab"><span class="tab-ico">♥</span>Intérêts</span>
    <span class="tab on"><span class="tab-ico">◎</span>Parcours</span>
    <span class="tab"><span class="tab-ico">✉</span>Messages</span>
    <span class="tab"><span class="tab-ico">☺</span>Moi 🙂</span>
  </nav>
</body>
</html>
