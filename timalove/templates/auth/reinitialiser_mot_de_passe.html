{% extends "layouts/auth.html" %}
{% block auth_content %}
<p style="color:var(--text-secondary);margin:0 0 1.25rem;line-height:1.5;">
  Choisissez un nouveau mot de passe (8 caractères minimum).
</p>
<form method="post" novalidate>
  {% csrf_token %}
  <div class="form-group">
    <label class="form-label" for="new-password">Nouveau mot de passe</label>
    <input class="form-input" id="new-password" type="password" name="password" required minlength="8" autocomplete="new-password">
  </div>
  <div class="form-group">
    <label class="form-label" for="confirm-password">Confirmer le mot de passe</label>
    <input class="form-input" id="confirm-password" type="password" name="password_confirm" required minlength="8" autocomplete="new-password">
  </div>
  <button class="btn btn-primary btn-block" type="submit">Enregistrer</button>
</form>
<p style="margin-top:1.25rem;text-align:center;">
  <a href="{% url 'auth:connexion' %}">Retour à la connexion</a>
</p>
{% endblock %}
