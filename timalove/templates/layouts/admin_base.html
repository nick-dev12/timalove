{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ title|default:brand_name }}{% endblock %} · TimaLove Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/timalove.css' %}?v=20260827promo1">
  <link rel="icon" href="{% static 'images/logo.webp' %}" type="image/webp">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}admin-panel-page{% endblock %}">
  {% block body %}{% endblock %}
</body>
</html>
