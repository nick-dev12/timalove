{% extends "layouts/auth.html" %}
{% block auth_content %}
<form method="post">{% csrf_token %}
  <div class="form-group"><label class="form-label">Email admin</label><input class="form-input" type="email" name="email" required></div>
  <div class="form-group"><label class="form-label">Mot de passe</label><input class="form-input" type="password" name="password" required></div>
  <button class="btn btn-primary btn-block" type="submit">Accéder</button>
</form>
{% endblock %}
