{% extends "layouts/admin.html" %}
{% block content %}
{% for t in transactions %}
<div class="card" style="margin-bottom:.5rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
  <div><strong>{{ t.order_id }}</strong><br><span style="font-size:.85rem;color:var(--text-muted);">{{ t.user }} · {{ t.type }} · {{ t.plan_tier }}</span></div>
  <div style="text-align:right;"><strong>{{ t.amount }} FCFA</strong><br>{{ t.status }}</div>
</div>
{% empty %}<div class="empty-state">Aucune transaction</div>{% endfor %}
{% endblock %}
