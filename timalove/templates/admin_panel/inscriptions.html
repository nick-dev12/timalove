{% extends "layouts/admin.html" %}
{% block content %}
<form method="get" class="card" style="margin-bottom:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
  <input class="form-input" name="q" value="{{ q }}" placeholder="Rechercher…" style="flex:1;">
  <select class="form-select" name="status" style="max-width:12rem;"><option value="">Tous</option>{% for v,l in statuses %}<option value="{{ v }}" {% if current_status == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
  <button class="btn btn-primary" type="submit">Filtrer</button>
</form>
{% for p in profiles %}
<article class="card" style="margin-bottom:.75rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
  <div style="flex:1;"><strong>{{ p.first_name }} {{ p.last_name }}</strong><br><span style="color:var(--text-muted);font-size:.85rem;">{{ p.email }} · {{ p.city }} · {{ p.registration_status }}</span></div>
  <form method="post">{% csrf_token %}<input type="hidden" name="profile_id" value="{{ p.id }}"><input type="hidden" name="status" value="approved"><button class="btn btn-primary btn-sm" type="submit">Approuver</button></form>
  <form method="post">{% csrf_token %}<input type="hidden" name="profile_id" value="{{ p.id }}"><input type="hidden" name="status" value="rejected"><button class="btn btn-outline btn-sm" type="submit">Rejeter</button></form>
</article>
{% empty %}<div class="empty-state">Aucun profil</div>{% endfor %}
{% endblock %}
