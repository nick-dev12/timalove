<div class="history__more-wrap">
  {% if subscription_gated %}
  <button type="button" class="history__more" data-subscription-upgrade>Voir plus</button>
  {% else %}
  <button
    type="button"
    class="history__more"
    hx-get="{% url 'public:historique_plus' %}?offset={{ next_offset }}"
    hx-target="closest .history__more-wrap"
    hx-swap="outerHTML"
  >Voir plus</button>
  {% endif %}
</div>
