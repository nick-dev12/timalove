{% if user.is_authenticated %}
<a class="explorer__icon-btn explorer__bell" href="{% url 'app:parametres' %}"{% if nav_badges.unread_notifications %} aria-label="Notifications, {{ nav_badges.unread_notifications }} non lue{{ nav_badges.unread_notifications|pluralize }}"{% else %} aria-label="Notifications"{% endif %}>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M6 17h12v-1.2c0-1.4-.7-2.6-1.8-3.4V9.5a4.2 4.2 0 1 0-8.4 0v2.9C6.7 13.2 6 14.4 6 15.8V17zm4.2 1.8a1.8 1.8 0 0 0 3.6 0"/></svg>
  <span class="explorer__bell-badge" data-unread-notifications{% if nav_badges.unread_notifications < 1 %} hidden{% endif %}>{% if nav_badges.unread_notifications > 99 %}99+{% elif nav_badges.unread_notifications > 0 %}{{ nav_badges.unread_notifications }}{% endif %}</span>
</a>
{% else %}
<a class="explorer__icon-btn explorer__bell" href="#" data-gate-open aria-label="Notifications">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M6 17h12v-1.2c0-1.4-.7-2.6-1.8-3.4V9.5a4.2 4.2 0 1 0-8.4 0v2.9C6.7 13.2 6 14.4 6 15.8V17zm4.2 1.8a1.8 1.8 0 0 0 3.6 0"/></svg>
</a>
{% endif %}
