{% load static %}
<div
  id="explorer-gate"
  class="explorer-gate"
  hidden
  role="dialog"
  aria-modal="true"
  aria-labelledby="explorer-gate-title"
>
  <button type="button" class="explorer-gate__backdrop" data-gate-close aria-label="Fermer"></button>
  <div class="explorer-gate__panel">
    <button type="button" class="explorer-gate__close" data-gate-close aria-label="Fermer">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
    </button>
    <p class="explorer-gate__brand brand-mark">
      <span>TimaLove</span>
      <img src="{% static 'images/logo.webp' %}" alt="" width="36" height="36">
    </p>
    <h2 id="explorer-gate-title">La suite se mérite.</h2>
    <p class="explorer-gate__lead">
      Photos nettes, likes, messages et vrais profils&nbsp;: créez votre compte pour entrer dans l'univers TimaLove.
    </p>
    <div class="explorer-gate__actions">
      <button type="button" class="explorer-gate__social explorer-gate__social--google" data-auth-google>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#EA4335" d="M12 10.2v3.6h5.1c-.2 1.2-.9 2.3-1.9 3l3 2.3c1.8-1.7 2.8-4.1 2.8-7 0-.7-.1-1.4-.2-2H12z"/>
          <path fill="#34A853" d="M6.6 14.3 5.5 15.1 3 17.1C4.7 20.5 8.1 23 12 23c2.9 0 5.3-1 7.1-2.6l-3-2.3c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3z"/>
          <path fill="#4A90D9" d="M3 6.9C2.4 8.1 2 9.5 2 11s.4 2.9 1 4.1C4.1 12.4 6.6 10.2 6.6 10.2 6.2 8.9 6.2 7.5 6.6 6.2L3 6.9z"/>
          <path fill="#FBBC05" d="M12 5c1.6 0 3 .6 4.1 1.6L18.8 4C16.9 2.2 14.6 1 12 1 8.1 1 4.7 3.5 3 6.9l3.6 2.8C7 7 9.3 5 12 5z"/>
        </svg>
        Continuer avec Google
      </button>
      <button type="button" class="explorer-gate__social explorer-gate__social--apple" data-auth-apple>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-1-3-.9c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.3 1.3-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.8zM14.6 5.8c.6-.8 1.1-1.9.9-3-1 .1-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.2-.5 2.9-1.4z"/>
        </svg>
        Continuer avec Apple
      </button>
      <a class="explorer-gate__primary" href="{% url 'auth:connexion' %}">Se connecter</a>
      <a class="explorer-gate__ghost" href="{% url 'auth:connexion' %}?signup=1">Créer mon compte</a>
    </div>
    <p class="explorer-gate__note">Gratuit · Vérifié · Orienté mariage</p>
  </div>
</div>
