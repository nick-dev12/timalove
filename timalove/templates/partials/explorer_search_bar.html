<form class="explorer-search" role="search" data-explorer-search{% if search_form_extra %} {{ search_form_extra }}{% endif %} onsubmit="return false;">
  <label class="explorer-search__field">
    <span class="visually-hidden">{{ search_label|default:"Rechercher" }}</span>
    <svg class="explorer-search__ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="m16.2 16.2 4.2 4.2"/>
    </svg>
    <input
      type="search"
      name="q"
      placeholder="{{ search_placeholder|default:'Rechercher…' }}"
      autocomplete="off"
      spellcheck="false"
      enterkeyhint="search"
      {% if search_url %}
      hx-get="{{ search_url }}"
      hx-trigger="keyup changed delay:180ms, search"
      hx-target="#{{ search_results_id|default:'explorer-search-results' }}"
      hx-swap="innerHTML"
      {% endif %}
      aria-autocomplete="list"
      aria-controls="{{ search_results_id|default:'explorer-search-results' }}"
    >
    <button type="button" class="explorer-search__clear" data-search-clear hidden aria-label="Effacer">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
    </button>
  </label>
  <div id="{{ search_results_id|default:'explorer-search-results' }}" class="explorer-search__results" role="listbox"></div>
</form>
