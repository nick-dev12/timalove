<div id="profile-modal" class="profile-modal" hidden>
  <div class="profile-modal__stage">
    <button type="button" class="profile-modal__backdrop" data-profile-modal-close aria-label="Fermer"></button>
    <div class="profile-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
      <div class="profile-modal__body" data-profile-modal-body></div>
    </div>
  </div>
</div>
<div id="photo-lightbox" class="photo-lightbox" hidden>
  <button type="button" class="photo-lightbox__close" data-lightbox-close aria-label="Fermer">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
  </button>
  <p class="photo-lightbox__counter" data-lightbox-counter hidden aria-live="polite"></p>
  <div class="photo-lightbox__stage" data-lightbox-stage>
    <button type="button" class="photo-lightbox__nav photo-lightbox__nav--prev" data-lightbox-prev aria-label="Photo précédente" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 6 9 12l6 6"/></svg>
    </button>
    <img class="photo-lightbox__img" alt="">
    <button type="button" class="photo-lightbox__nav photo-lightbox__nav--next" data-lightbox-next aria-label="Photo suivante" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>
