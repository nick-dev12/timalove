# TimaLove — vhost Nginx (Webuzo)
# Copié par bootstrap.sh vers le dossier conf.d de Nginx.
# Daphne écoute uniquement en local : 127.0.0.1:8001

upstream timalove_daphne {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name timalove.goo-bridge.com www.timalove.goo-bridge.com;

    client_max_body_size 20M;

    # Let's Encrypt (Webuzo / certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /home/colobanes/timalove.goo-bridge.com;
        allow all;
    }

    location /static/ {
        alias /home/colobanes/timalove.goo-bridge.com/timalove/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/colobanes/timalove.goo-bridge.com/timalove/media/;
        expires 7d;
        access_log off;
    }

    location /ws/ {
        proxy_pass http://timalove_daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        proxy_pass http://timalove_daphne;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

